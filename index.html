<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>INSTA PACK | انستا باك</title><meta name="description" content="انستا باك لمواد التعبئة والتغليف — علب بلاستيك، أطباق فويل وفوم، مناديل، كوفير سياحي وأدوات شيف. منيل شيحة، الجيزة."><meta name="theme-color" content="#241046"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" media="print" onload="this.media='all'"><style id="css">
:root{--bg:#f6f3fc;--card:#fff;--ink:#241046;--mute:#675a85;--line:#e0d8f0;--acc:#f5b53b;--acc-ink:#2a1259;--pri:#5b2bb5;--ph:#ece6f8;--ok:#1b7f4b;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120a24;--card:#1c1236;--ink:#f1ecfb;--mute:#a99dc6;--line:#33265a;--ph:#271a47;--ok:#58d08e;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#120a24;--card:#1c1236;--ink:#f1ecfb;--mute:#a99dc6;--line:#33265a;--ph:#271a47;--ok:#58d08e;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(160deg,#4a1fa0,#241046);color:#fff;padding:26px 0 22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:68px;height:68px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--acc)}.logo img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-size:26px;letter-spacing:.5px;direction:ltr;text-align:right}
.tag{margin:0;color:#c3cfdd;font-size:15px}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;font:600 15px "Readex Pro",sans-serif;text-decoration:none;border:1.5px solid transparent;cursor:pointer;background:none}
.btn.wa{background:var(--acc);color:var(--acc-ink)}
.btn.ln{border-color:currentColor;color:var(--ink)}
header .btn.ln{color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.notice{background:var(--acc);color:var(--acc-ink);text-align:center;font-weight:600;font-size:14px;padding:8px 12px}
h2{font-size:20px;margin:24px 0 12px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding-bottom:30px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;color:var(--ink);font:600 16px "Readex Pro",sans-serif}
.cat .e{display:block;font-size:42px;line-height:1.3}.cat small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.cat:hover{border-color:var(--pri)}.cat .e{filter:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.search{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:400 16px "Readex Pro",sans-serif}
.back{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14px "Readex Pro",sans-serif;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:4/3;background:var(--ph);display:grid;place-items:center;font-size:54px;position:relative}
.img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0;font-size:17px}.specs{margin:0;padding:0;list-style:none;color:var(--mute);font-size:14px}
.specs li::before{content:"✓ ";color:var(--ok)}
.price{font-size:22px;font-weight:700;margin-top:auto}.price small{font-size:13px;font-weight:400;color:var(--mute)}
.row{display:flex;gap:8px}.row .btn{flex:1;min-height:42px;font-size:14px;padding:0 8px}
.empty{text-align:center;color:var(--mute);padding:50px 0}
footer{background:#1c0b3d;color:#c3cfdd;padding:24px 0;font-size:14px}footer a{color:#ffb08a}
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;align-items:end;z-index:20}.box{background:var(--card);padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;display:grid;gap:10px;text-align:center}.box .btn.ln{color:var(--ink);border-color:var(--line)}.num{font-size:28px;font-weight:700;margin:0;direction:ltr}
 .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:14px}.panel h3{margin:0}.panel label,.chk{display:grid;gap:4px;font-size:14px;color:var(--mute)}.chk{display:flex;gap:8px;align-items:center}.fld,.mini{width:100%;min-height:42px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:6px 10px;font:400 15px "Readex Pro",sans-serif}.cat.ed{display:grid;gap:8px;cursor:default}.mini{text-align:center}.dg{color:var(--bad)}.up{cursor:pointer;overflow:hidden}.up input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}.up em{position:absolute;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-style:normal;font-size:12px;padding:2px 10px;border-radius:999px}#adm{position:fixed;inset-inline:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}#adm:empty{display:none}#st{font-size:13px;color:var(--mute)}.btn:disabled{opacity:.6}body.adm{padding-bottom:90px}
