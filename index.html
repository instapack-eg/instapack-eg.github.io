<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>INSTA PACK | انستا باك</title><meta name="description" content="انستا باك لمواد التعبئة والتغليف — علب بلاستيك، أطباق فويل وفوم، مناديل، كوفير سياحي وأدوات شيف. منيل شيحة، الجيزة."><meta name="theme-color" content="#241046"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" media="print" onload="this.media='all'"><style id="css">
:root{--bg:#f6f3fc;--card:#fff;--ink:#241046;--mute:#675a85;--line:#e0d8f0;--acc:#f5b53b;--acc-ink:#2a1259;--pri:#5b2bb5;--ph:#ece6f8;--ok:#1b7f4b;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120a24;--card:#1c1236;--ink:#f1ecfb;--mute:#a99dc6;--line:#33265a;--ph:#271a47;--ok:#58d08e;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#120a24;--card:#1c1236;--ink:#f1ecfb;--mute:#a99dc6;--line:#33265a;--ph:#271a47;--ok:#58d08e;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(160deg,#4a1fa0,#241046);color:#fff;padding:26px 0 22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:68px;height:68px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--acc)}.logo img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-size:26px;letter-spacing:.5px;direction:ltr;text-align:right}
.tag{margin:0;color:#c3cfdd;font-size:15px}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;font:600 15px "Readex Pro",sans-serif;text-decoration:none;border:1.5px solid transparent;cursor:pointer;background:none}
.btn.wa{background:var(--acc);color:var(--acc-ink)}
.btn.ln{border-color:currentColor;color:var(--ink)}
header .btn.ln{color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.notice{background:var(--acc);color:var(--acc-ink);text-align:center;font-weight:600;font-size:14px;padding:8px 12px}
h2{font-size:20px;margin:24px 0 12px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding-bottom:30px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;color:var(--ink);font:600 16px "Readex Pro",sans-serif}
.cat .e{display:block;font-size:42px;line-height:1.3}.cat small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.cat:hover{border-color:var(--pri)}.cat .e{filter:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.search{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:400 16px "Readex Pro",sans-serif}
.back{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14px "Readex Pro",sans-serif;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:4/3;background:var(--ph);display:grid;place-items:center;font-size:54px;position:relative}
.img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0;font-size:17px}.specs{margin:0;padding:0;list-style:none;color:var(--mute);font-size:14px}
.specs li::before{content:"✓ ";color:var(--ok)}
.price{font-size:22px;font-weight:700;margin-top:auto}.price small{font-size:13px;font-weight:400;color:var(--mute)}
.row{display:flex;gap:8px}.row .btn{flex:1;min-height:42px;font-size:14px;padding:0 8px}
.empty{text-align:center;color:var(--mute);padding:50px 0}
footer{background:#1c0b3d;color:#c3cfdd;padding:24px 0;font-size:14px}footer a{color:#ffb08a}
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;align-items:end;z-index:20}.box{background:var(--card);padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;display:grid;gap:10px;text-align:center}.box .btn.ln{color:var(--ink);border-color:var(--line)}.num{font-size:28px;font-weight:700;margin:0;direction:ltr}
 .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:14px}.panel h3{margin:0}.panel label,.chk{display:grid;gap:4px;font-size:14px;color:var(--mute)}.chk{display:flex;gap:8px;align-items:center}.fld,.mini{width:100%;min-height:42px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:6px 10px;font:400 15px "Readex Pro",sans-serif}.cat.ed{display:grid;gap:8px;cursor:default}.mini{text-align:center}.dg{color:var(--bad)}.up{cursor:pointer;overflow:hidden}.up input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}.up em{position:absolute;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-style:normal;font-size:12px;padding:2px 10px;border-radius:999px}#adm{position:fixed;inset-inline:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}#adm:empty{display:none}#st{font-size:13px;color:var(--mute)}.btn:disabled{opacity:.6}body.adm{padding-bottom:90px}

const $=i=>document.getElementById(i),root=$("root"),DATA=JSON.parse($("data").textContent);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const intl=s=>"20"+String(s).replace(/\D/g,"").replace(/^0+/,"");
const wa=t=>`https://wa.me/${intl(DATA.shop.show)}?text=${encodeURIComponent(t)}`;
let cur=null,edit=false,canEdit=false;
const byHash=()=>DATA.cats.find(c=>c.id===location.hash.slice(1))||null;
cur=byHash();

function cards(){const t=($("q")&&$("q").value||"").trim(),S=DATA.shop;
 const L=cur.list.filter(p=>!t||(p.n+p.d.join(" ")).includes(t));
 return L.length?L.map(p=>{const pr=p.p!=null?`${p.p} <small>جنيه${p.u?" / "+esc(p.u):""}</small>`:`<small>السعر عند الطلب</small>`;
 return`<article class="card"><div class="img">${p.img?`<img src="${p.img}" alt="${esc(p.n)}" loading="lazy">`:`<span aria-hidden="true">${esc(cur.e)}</span>`}${p.out?'<span class="badge">غير متاح حاليًا</span>':""}</div><div class="body"><h3>${esc(p.n)}</h3><ul class="specs">${p.d.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="price">${p.out?"":pr}</div><div class="row"><a class="btn wa" target="_blank" rel="noopener" href="${wa("السلام عليكم، عايز أطلب: "+p.n)}">اطلب الآن</a><a class="btn ln" target="_blank" rel="noopener" href="${esc(S.mapUrl)}">الموقع</a></div></div></article>`}).join(""):`<div class="empty">مفيش منتجات مطابقة. اطلب منتجك عبر واتساب.</div>`}

function editCards(){return cur.list.map((p,i)=>`<article class="card"><label class="img up">${p.img?`<img src="${p.img}" alt="">`:`<span>${esc(cur.e)}</span>`}<em>${p.img?"تغيير الصورة":"إضافة صورة"}</em><input type="file" accept="image/*" hidden data-act="img" data-i="${i}"></label><div class="body"><input class="fld" data-k="n" data-i="${i}" value="${esc(p.n)}" placeholder="اسم المنتج"><textarea class="fld" data-k="d" data-i="${i}" rows="3" placeholder="التفاصيل (كل سطر ميزة)">${esc(p.d.join("\n"))}</textarea><div class="row"><input class="fld" data-k="p" data-i="${i}" inputmode="decimal" value="${p.p??""}" placeholder="السعر"><input class="fld" data-k="u" data-i="${i}" value="${esc(p.u||"")}" placeholder="الوحدة"></div><label class="chk"><input type="checkbox" data-k="out" data-i="${i}" ${p.out?"checked":""}> غير متاح حاليًا</label><button class="back dg" data-act="del" data-i="${i}">حذف المنتج</button></div></article>`).join("")+`<button class="cat" data-act="addp">＋ منتج جديد</button>`}

function panel(){const S=DATA.shop,f=(k,l,ph)=>`<label>${l}<input class="fld" data-s="${k}" value="${esc(S[k])}" placeholder="${ph||""}"></label>`;
 return`<div class="panel"><h3>بيانات المحل</h3>${f("show","رقم الواتساب والاتصال","01xxxxxxxxx")}${f("address","العنوان")}${f("tag","الوصف تحت الاسم")}${f("notice","شريط التنبيه")}${f("mapUrl","رابط الموقع على الخريطة")}<label>اللوجو<input type="file" accept="image/*" data-act="logo"></label></div>`}

function render(){const S=DATA.shop;if(location.hash==="#admin"&&!canEdit){root.innerHTML=`<section class="wrap"><div class="panel" style="margin-top:24px"><h3>دخول الإدارة</h3><label>مفتاح GitHub<input class="fld" id="tok" type="password" autocomplete="off" placeholder="الصق المفتاح هنا"></label><button class="btn wa" data-act="login">دخول</button><span id="lg"></span></div></section>`;return}
 let h=`<header><div class="wrap"><div class="brand"><div class="logo"><img src="${DATA.logo}" alt="شعار انستا باك"></div><div><h1>INSTA PACK</h1><p class="tag">${esc(S.tag)}</p></div></div><div class="acts"><a class="btn wa" target="_blank" rel="noopener" href="${wa("السلام عليكم، عايز أستفسر عن منتجات INSTA PACK")}">تواصل عبر واتساب</a><a class="btn ln call" href="tel:${esc(S.show)}" target="_blank" rel="noopener">اتصل بنا</a><a class="btn ln" target="_blank" rel="noopener" href="${esc(S.mapUrl)}">موقعنا على الخريطة</a></div></div></header><div class="notice">${esc(S.notice)}</div>`;
 if(!cur){h+=`<section class="wrap"><h2>الأقسام</h2>${edit?panel():""}<div class="cats">`+DATA.cats.map((c,i)=>edit?`<div class="cat ed"><input class="mini" data-c="e" data-i="${i}" value="${esc(c.e)}" aria-label="رمز"><input class="mini" data-c="n" data-i="${i}" value="${esc(c.n)}" aria-label="اسم القسم"><button class="back" data-act="open" data-i="${i}">فتح</button><button class="back dg" data-act="delcat" data-i="${i}">حذف القسم</button></div>`:`<button class="cat" data-act="open" data-i="${i}"><span class="e">${esc(c.e)}</span>${esc(c.n)}<small>${c.list.length} منتج</small></button>`).join("")+(edit?`<button class="cat" data-act="addcat">＋ قسم جديد</button>`:"")+`</div></section>`}
 else h+=`<section class="wrap"><div class="bar"><button class="back" data-act="home">→ الأقسام</button>${edit?"":`<input class="search" id="q" type="search" placeholder="ابحث داخل القسم…" aria-label="بحث">`}</div><h2>${esc(cur.n)}</h2><div class="grid" id="grid">${edit?editCards():cards()}</div></section>`;
 h+=`<footer><div class="wrap">INSTA PACK<br>${esc(S.address)}<br><a href="${wa("السلام عليكم")}" target="_blank" rel="noopener">واتساب: ${esc(S.show)}</a> · <a class="call" href="tel:${esc(S.show)}" target="_blank" rel="noopener">اتصال: ${esc(S.show)}</a></div></footer><div class="sheet" id="sheet" hidden><div class="box"><b>اتصل بنا</b><p class="num">${esc(S.show)}</p><a class="btn wa" href="tel:${esc(S.show)}" target="_blank" rel="noopener">اتصل الآن</a><button class="btn ln" data-act="copy">نسخ الرقم</button><button class="btn ln" data-act="closesheet">إغلاق</button></div></div>`;
 root.innerHTML=h}

function bar(){document.body.classList.toggle("adm",canEdit);$("adm").innerHTML=!canEdit?"":edit?`<button class="btn wa" data-act="save">حفظ ونشر للعملاء</button><button class="btn ln" data-act="cancel">إلغاء</button><span id="st"></span>`:`<button class="btn wa" data-act="edit">✏️ تعديل الموقع</button><button class="btn ln" data-act="logout">خروج</button>`}
const st=t=>{const e=$("st");if(e)e.textContent=t};

function shrink(file,max){return new Promise(res=>{const r=new FileReader;r.onload=()=>{const i=new Image;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.78))};i.src=r.result};r.readAsDataURL(file)})}

const buildDoc=()=>'<!DOCTYPE html><html lang="ar" dir="rtl"><head>'+HEAD+'<style id="css">'+$("css").textContent+'</style></head><body><div id="root"></div><div id="adm"></div><script id="data" type="application/json">'+JSON.stringify(DATA).replace(/</g,"\\u003c")+'<\/script><script id="app">'+$("app").textContent+'<\/script></body></html>';

const GH={o:"instapack-eg",r:"instapack-eg.github.io",p:"index.html",b:"main"};
const tok=()=>{try{return localStorage.getItem("gh_tok")||""}catch(_){return ""}};
function b64(s){const b=new TextEncoder().encode(s);let o="";for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
async function save(){const b=document.querySelector('[data-act="save"]');b.disabled=true;
 const doc=buildDoc();
 if(doc.length>20e6){st("حجم الصور كبير، قلّل عدد الصور");b.disabled=false;return}
 st("جاري الحفظ…");
 const H={Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json"},u=`https://api.github.com/repos/${GH.o}/${GH.r}/contents/${GH.p}`;
 try{
  const g=await fetch(u+"?ref="+GH.b,{headers:H});
  if(g.status===401||g.status===403)throw "auth";
  const sha=g.ok?(await g.json()).sha:undefined;
  const r=await fetch(u,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({message:"تحديث الكتالوج",content:b64(doc),branch:GH.b,...(sha?{sha}:{})})});
  if(r.status===401||r.status===403||r.status===404)throw "auth";
  if(!r.ok)throw "http"+r.status;
  st("تم الحفظ ✓ — يظهر للعملاء بعد دقيقة أو اتنين");
 }catch(e){st(e==="auth"?"المفتاح غير صالح أو منتهي — اضغط خروج وادخل بمفتاح جديد":"تعذر الحفظ ("+(e&&e.message||e)+")")}
 b.disabled=false}

document.addEventListener("click",e=>{
 const c=e.target.closest("a.call");
 if(c){let left=false;const f=()=>{left=true};addEventListener("blur",f,{once:true});document.addEventListener("visibilitychange",f,{once:true});setTimeout(()=>{if(!left&&$("sheet"))$("sheet").hidden=false},1500);return}
 const t=e.target.closest("[data-act]");if(!t||t.type==="file")return;const a=t.dataset.act,i=+t.dataset.i;
 if((a==="del"||a==="delcat")&&t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="اضغط للتأكيد";return}
 if(a==="open")location.hash=DATA.cats[i].id;
 else if(a==="home")location.hash="";
 else if(a==="edit"){edit=true;bar();render()}
 else if(a==="cancel")location.reload();
 else if(a==="login"){const v=($("tok").value||"").trim();if(!v)return;try{localStorage.setItem("gh_tok",v)}catch(_){$("lg").textContent="المتصفح منع الحفظ";return}canEdit=true;location.hash="";bar();render()}
 else if(a==="logout"){try{localStorage.removeItem("gh_tok")}catch(_){}canEdit=false;edit=false;bar();render()}
 else if(a==="save")save();
 else if(a==="addp"){cur.list.push({n:"منتج جديد",d:[],p:null,u:"للقطعة",out:false});render();scrollTo(0,document.body.scrollHeight)}
 else if(a==="del"){cur.list.splice(i,1);render()}
 else if(a==="addcat"){DATA.cats.push({id:"c"+Date.now().toString(36),n:"قسم جديد",e:"📦",list:[]});render()}
 else if(a==="delcat"){DATA.cats.splice(i,1);render()}
 else if(a==="closesheet")$("sheet").hidden=true;
 else if(a==="copy"){navigator.clipboard&&navigator.clipboard.writeText(DATA.shop.show).then(()=>t.textContent="تم النسخ ✓",()=>t.textContent=DATA.shop.show)}
});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="q"){$("grid").innerHTML=cards();return}
 if(!edit)return;const i=+t.dataset.i;
 if(t.dataset.c)DATA.cats[i][t.dataset.c]=t.value;
 else if(t.dataset.s)DATA.shop[t.dataset.s]=t.value;
 else if(t.dataset.k){const p=cur.list[i],k=t.dataset.k,v=t.type==="checkbox"?t.checked:t.value;
  if(k==="d")p.d=v.split("\n").map(x=>x.trim()).filter(Boolean);
  else if(k==="p")p.p=v.trim()===""?null:(parseFloat(v.replace(",","."))||0);
  else p[k]=v}});
document.addEventListener("change",async e=>{const t=e.target;if(t.type!=="file"||!t.files[0])return;
 const u=await shrink(t.files[0],t.dataset.act==="logo"?256:640);
 if(t.dataset.act==="logo")DATA.logo=u;else cur.list[+t.dataset.i].img=u;render()});
addEventListener("hashchange",()=>{cur=byHash();render();scrollTo(0,0)});
canEdit=!!tok();render();bar();
</script></body></html>
