 P.innerHTML=`<div class="ph"><b>${nm(sel)}</b><span><button class="back" data-act="gohome">الرئيسية</button> <button class="back" data-act="gofirst">فتح قسم</button> <button class="back" data-act="selx">✕</button></span></div><div class="pr">لون الخلفية<div class="sws">${sw("bg")}</div></div><div class="pr">لون الخط<div class="sws">${sw("color")}</div></div>${sel==="hero"?`<div class="pr">صورة الغلاف<div class="sws"><label class="back up2">اختر صورة<input type="file" accept="image/*" data-act="himg"></label><button class="back" data-act="rimg">إزالة الصورة</button></div></div>${DATA.cover?rg("ch","ارتفاع الغلاف (0 = كما هو)",0,520,10,0)+rg("cpx","موضع الصورة يمين / يسار",0,100,1,50)+rg("cpy","موضع الصورة فوق / تحت",0,100,1,50)+rg("cz","تكبير الصورة",1,2.5,.05,1)+rg("cr","تدوير الصورة",-15,15,.5,0):rg("h","ارتفاع الغلاف",0,120,4,0)}`:""}${sel!=="page"?rg("z","الحجم",.6,1.6,.05,1):""}${mv?rg("x","تحريك يمين / يسار",-160,160,2,0)+rg("y","تحريك فوق / تحت",-160,160,2,0)+`<div class="sws"><button class="back" data-act="nud" data-ax="y" data-v="-10">⬆</button><button class="back" data-act="nud" data-ax="y" data-v="10">⬇</button><button class="back" data-act="nud" data-ax="x" data-v="-10">⬅</button><button class="back" data-act="nud" data-ax="x" data-v="10">➡</button></div>`:""}${extra()}<button class="back dg" data-act="rst">إرجاع للأصل</button>`;mark()}
document.addEventListener("click",e=>{if(!design||e.target.closest("#adm,#pnl"))return;e.preventDefault();e.stopPropagation();const b=e.target.closest("[data-b]");sel=b?b.dataset.b:"page";pnl()},true);

const HIDE=["hero","hbtns","feat","notice","footer"];
const isMV=k=>["htitle","hsub","hbtns","hart","feat","notice","top"].includes(k)||/^[ts]_/.test(k);
const nm=k=>NM[k]||(/^t_/.test(k)?"مربع: "+((DATA.cats.find(c=>"t_"+c.id===k)||{}).n||""):/^s_/.test(k)?"قسم مضاف":k);
function extra(){let h="";const k=sel;const tc=/^t_/.test(k)&&DATA.cats.find(c=>"t_"+c.id===k),sc=/^s_/.test(k)&&(DATA.secs||[]).find(x=>"s_"+x.id===k);if(tc&&tc.img)h+=icUI("t",tc.ic);if(sc&&sc.img)h+=icUI("s",sc.ic);
 if(/^t_/.test(k))h+=`<div class="pr">صورة المربع<div class="sws"><label class="back up2">اختر صورة<input type="file" accept="image/*" data-act="timg"></label><button class="back" data-act="rtimg">إزالة الصورة</button></div></div><div class="sws"><button class="back" data-act="mvt" data-d="-1">⬆ فوق</button><button class="back" data-act="mvt" data-d="1">⬇ تحت</button></div>`;
 if(/^s_/.test(k)){const x=(DATA.secs||[]).find(x=>"s_"+x.id===k);if(x)h+=`<label class="pr">العنوان<input class="fld" data-sec="t" value="${esc(x.t)}"></label><label class="pr">النص<textarea class="fld" rows="3" data-sec="x">${esc(x.x)}</textarea></label><div class="pr">الصورة<div class="sws"><label class="back up2">اختر صورة<input type="file" accept="image/*" data-act="simg"></label><button class="back" data-act="rsimg">إزالة</button></div></div><div class="sws"><button class="back" data-act="mvs" data-d="-1">⬆ فوق</button><button class="back" data-act="mvs" data-d="1">⬇ تحت</button><button class="back dg" data-act="delsec">حذف القسم</button></div>`}
 if(HIDE.includes(k))h+=`<button class="back dg" data-act="hide">حذف هذا الجزء</button> `;
 if(k==="page"){const hs=HIDE.filter(x=>(DATA.style[x]||{}).hide);if(hs.length)h+=`<div class="pr">أجزاء محذوفة<div class="sws">${hs.map(x=>`<button class="back" data-act="unhide" data-f="${x}">استرجاع: ${NM[x]}</button>`).join("")}</div></div>`}
 return h}

function xcols(p){const h=(DATA.cols||[]).filter(c=>p[c.k]!=null&&String(p[c.k]).trim()!=="").map(c=>`<span>${esc(c.l)}: <b>${esc(p[c.k])}</b>${/^[\d.]+$/.test(String(p[c.k]))?" جنيه":""}</span>`).join("");return h?`<div class="tiers">${h}</div>`:""}
function ist(ic,h){ic=ic||{};return`object-fit:cover;object-position:${ic.px??50}% ${ic.py??50}%;${(ic.z&&ic.z!=1)||ic.r?`transform:scale(${ic.z||1}) rotate(${ic.r||0}deg);`:""}${h&&ic.h?`max-height:none;height:${ic.h}px;`:""}`}
function wst(ic){return ic&&ic.h?`aspect-ratio:auto;flex:none;height:${ic.h}px;`:""}
function icUI(k,ic,i){ic=ic||{};const r=(f,l,mn,mx,st,d)=>`<label class="pr">${l}<input type="range" data-ic="${f}" data-ico="${k}" data-i="${i??""}" min="${mn}" max="${mx}" step="${st}" value="${ic[f]??d}"></label>`;return`<div class="pr"><b>ضبط الصورة</b></div>`+r("h","ارتفاع الصورة (0 = تلقائي)",0,500,10,0)+r("px","موضع الصورة يمين / يسار",0,100,1,50)+r("py","موضع الصورة فوق / تحت",0,100,1,50)+r("z","تكبير الصورة",1,2.5,.05,1)+r("r","تدوير الصورة",-15,15,.5,0)}
function icObj(t){const k=t.dataset.ico;return k==="t"?DATA.cats.find(c=>"t_"+c.id===sel):k==="s"?(DATA.secs||[]).find(x=>"s_"+x.id===sel):cur&&cur.list[+t.dataset.i]}
function icLive(t,o){const k=t.dataset.ico;let w=null,im=null;if(k==="t"){w=document.querySelector(`[data-b="${sel}"] .ci`)}else if(k==="s"){im=document.querySelector(`[data-b="${sel}"] img`)}else{const c=document.querySelectorAll("#grid .card")[+t.dataset.i];w=c&&c.querySelector(".img")}
 if(w){im=w.querySelector("img");w.style.cssText=wst(o.ic)}if(im)im.style.cssText=ist(o.ic,k==="s")}
function lcs(p){return(p.lines||[]).filter(l=>(l.p!=null&&l.p!=="")||String(l.u||"").trim()).map(l=>{const has=l.p!=null&&l.p!=="";return has?`<div class="price pl">${esc(l.p)} <small>جنيه${l.u?" / "+esc(l.u):""}</small></div>`:`<div class="pl"><small>${esc(l.u)}</small></div>`}).join("")}
function lnEd(p,i){return `<div class="pr">أسعار إضافية (دستة، كرتونة...)${(p.lines||[]).map((l,j)=>`<div class="row"><input class="fld" inputmode="decimal" data-ln="p" data-i="${i}" data-j="${j}" value="${l.p??""}" placeholder="السعر"><input class="fld" data-ln="u" data-i="${i}" data-j="${j}" value="${esc(l.u||"")}" placeholder="الوحدة (للدستة)"><button class="back dg" data-act="delln" data-i="${i}" data-j="${j}">✕</button></div>`).join("")}<button class="back" data-act="addln" data-i="${i}">＋ سعر آخر</button></div>`}
function colsPanel(){const L=DATA.lbl;return`<div class="panel"><h3>خانات الأسعار والكميات (تنطبق على كل المنتجات)</h3><label>اسم خانة السعر<input class="fld" data-lb="p" value="${esc(L.p)}"></label><label>اسم خانة الوحدة<input class="fld" data-lb="u" value="${esc(L.u)}"></label>${DATA.cols.map((c,j)=>`<div class="row"><input class="fld" data-col="${j}" value="${esc(c.l)}" aria-label="اسم الخانة"><button class="back dg" data-act="delcol" data-i="${j}">حذف</button></div>`).join("")}<button class="back" data-act="addcol">＋ خانة جديدة</button></div>`}

(function(){try{if(sessionStorage.getItem("ip_intro")||matchMedia("(prefers-reduced-motion:reduce)").matches)return;sessionStorage.setItem("ip_intro","1")}catch(_){}
 const el=document.createElement("div");el.id="intro";el.innerHTML=`<div class="rays"></div><div class="gl"></div><img class="lg" src="${DATA.intro||DATA.logo}" alt=""><div class="ldb"><i></i></div>`;document.body.appendChild(el);
 const end=()=>{if(el.classList.contains("out"))return;el.classList.add("out");setTimeout(()=>el.remove(),700)};el.onclick=end;setTimeout(end,3000)})();
</script></body></html>
